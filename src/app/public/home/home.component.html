<h5 *ngIf="loading">Loading...</h5>
<main class="container grid mx-auto py-20 px-8 gap-7 lg:grid-cols-3 md:grid-cols-2">
    <!-- | paginate: { itemsPerPage:itemsPerPage, currentPage: p} -->
    <div *ngFor="let movie of allMovies | paginate: { itemsPerPage:PER_PAGE, currentPage: p, totalItems: totalMovies}"
        class="bg-white shadow hover:shadow-lg">
        <img class="rounded-t-lg h-80 lg:h-72 md:h-48 w-full object-cover object-center "
            src="{{movie.thumbnailUrl}}"
            alt="movie thambnail">
        <!-- src="{{movie.thumbnailUrl}}" -->
        <div class=" p-6">
            <p class=" inline  text-sm normal-case text-yellow-700 px-3 py-1 rounded-sm bg-yellow-200"> {{movie.genre}} </p>

            <h1 class="text-2xl font-semibold capitalize py-3  ">{{movie.title}}</h1>

            <p class="p-1">
                Release Date:
                <span class=" text-slate-600">{{movie.relaseDate}} </span>
            </p>
            <p class=" p-1">
                Author:
                <span class=" text-slate-600">{{movie.author.username}} </span>
            </p>
            <div class=" flex justify-between cursor-pointer">

                <p class="p-1">
                    Created at:
                    <span class=" text-slate-600"> {{movie.createdAt | dateAgo }} </span>
                </p>
                <div class=" flex items-center">
                    <div>
                        <a [routerLink]="['/movie-detail', movie?.id]" class=" font-semibold text-indigo-500 underline mr-1 ">learn more</a>
                    </div>
                    <div class=" mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6 text-indigo-500">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17.25 8.25L21 12m0 0l-3.75 3.75M21 12H3" />
                        </svg>
                    </div>
                </div>
            </div>

        </div>
        <div class="flex justify-between border-t">
            <div class="flex p-6">
                <div class=" mr-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-7 h-7">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
                    </svg>
                </div>
                <p>{{movie.comments.length}}</p>
            </div>
            <div class="flex p-6">
                <div class=" mr-1  ">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-7 h-7">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                    </svg>
                </div>
                <p>{{movie.likes.length}}</p>
            </div>
        </div>
    </div>
</main>

<div class="mt-8 py-5 flex justify-center">
    <pagination-controls class=" mx-auto" (pageChange)="p = $event"></pagination-controls>
</div>
