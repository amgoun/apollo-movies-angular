<!-- component -->

<div
  class="relative flex min-h-screen text-gray-800 antialiased flex-col justify-center overflow-hidden bg-gray-50 py-6 sm:py-12"
>
  <form (ngSubmit)="onSubmit(signupForm)" #signupForm="ngForm">
    <div class="relative py-3 sm:w-96 mx-auto text-center">
      <span class="text-2xl font-light">signup</span>
      <div class="mt-4 bg-white shadow-md rounded-lg text-left">
        <div class="h-2 bg-indigo-500 rounded-t-md"></div>
        <div class="px-8 py-6">
          <label class="blockmt-3 font-semibold"> Name </label>
          <input
            [(ngModel)]="name"
            type="text"
            name="name"
            required
            #user_name="ngModel"
            minlength="2"
            maxlength="15"
            placeholder="Name"
            class="form-control border w-full h-5 px-3 py-5 mt-2 hover:outline-none focus:outline-none focus:ring-indigo-500 focus:ring-1 rounded-md"
          />
          <div
            *ngIf="user_name.invalid && user_name.touched"
            class="py-1 text-xs italic text-red-500"
          >
            <span *ngIf="user_name.errors?.required"> name required</span>
            <span *ngIf="user_name.errors?.minlength">
              name must be more than 2 characters
            </span>
          </div>
          <label class="block mt-3 font-semibold"> Username </label>
          <input
            [(ngModel)]="username"
            type="text"
            name="username"
            required
            #user_username="ngModel"
            minlength="2"
            maxlength="15"
            placeholder="Username"
            class="border w-full h-5 px-3 py-5 mt-2 hover:outline-none focus:outline-none focus:ring-indigo-500 focus:ring-1 rounded-md"
          />
          <div
            *ngIf="user_username.invalid && user_name.touched"
            class="py-1 text-xs italic text-red-500"
          >
            <span *ngIf="user_username.errors?.required">
              username required</span
            >
            <span *ngIf="user_username.errors?.minlength">
              username must be more than 2 characters
            </span>
          </div>
          <label class="block mt-3 font-semibold"> Email </label>
          <input
            [(ngModel)]="email"
            type="email"
            name="email"
            required
            #user_email="ngModel"
            minlength="5"
            maxlength="30"
            placeholder="Email"
            class="border w-full h-5 px-3 py-5 mt-2 hover:outline-none focus:outline-none focus:ring-indigo-500 focus:ring-1 rounded-md"
          />
          <div
            *ngIf="user_email.invalid && user_name.touched"
            class="py-1 text-xs italic text-red-500"
          >
            <span *ngIf="user_email.errors?.required"> email required</span>
            <span *ngIf="user_email.errors?.minlength">
              email must be more than 2 characters
            </span>
          </div>
          <label class="block mt-3 font-semibold">Password </label>
          <input
            [(ngModel)]="password"
            type="password"
            name="password"
            required
            #user_password="ngModel"
            minlength="6"
            maxlength="30"
            placeholder="Password"
            class="border w-full h-5 px-3 py-5 mt-2 hover:outline-none focus:outline-none focus:ring-indigo-500 focus:ring-1 rounded-md"
          />
          <div
            *ngIf="user_password.invalid && user_password.touched"
            class="py-1 text-xs italic text-red-500"
          >
            <span *ngIf="user_password.errors?.required">
              password required</span
            >
            <span *ngIf="user_password.errors?.minlength">
              password must be more than 6 characters
            </span>
          </div>
          <div class="flex justify-between items-baseline">
            <button
              [disabled]="!signupForm.valid"
              type="submit"
              class="mt-4 bg-indigo-500 text-white py-2 px-6 rounded-md hover:bg-indigo-400"
            >
              Login
            </button>
            <a   [routerLink]="['/login']" class="text-sm hover:underline">
              already have an account</a
            >
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
