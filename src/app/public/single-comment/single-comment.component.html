<div class="bg-white shadow conatiner p-11 mx-auto max-w-5xl mt-28 mb-28">
  <p class="text-lg p-4">{{ comment?.content }}</p>
  <p class="text-sm p-4">created date: {{ comment?.createdAt | dateAgo }}</p>

  <div class="flex gap-4" *ngIf="isLoggedIn">
    <div class="text-green-500">
      <div
        class="flex gap-1 border content-center border-green-400 p-2 rounded-lg hover:bg-green-400 hover:text-white hover:cursor-pointer"
      >
        <div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"
            />
          </svg>
        </div>
        <div>
          <div (click)="togleMenu()">
            <span> Update</span>
          </div>
        </div>
      </div>
    </div>
    <div class="text-red-500">
      <div
        class="flex gap-1 border content-center border-red-400 p-2 rounded-lg hover:bg-red-400 hover:text-white hover:cursor-pointer"
      >
        <div class="self-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"
            />
          </svg>
        </div>
        <div (click)="deleteComment()">
          <span> Delete</span>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="expand" class="bg-white p-8 mt-10 shadow-lg max-w-screen-md">
    <form
      (ngSubmit)="updateComment(updateCommentForm)"
      #updateCommentForm="ngForm"
    >
      <label class="block mt-3 font-semibold"> comment </label>
      <textarea
        class="bg-[#f8fafc] rounded border plch border-gray-300 leading-normal resize-none w-full h-20 py-2 px-3 font-medium placeholder-gray-700 focus:outline-none focus:bg-white"
        [(ngModel)]="contentToUpdate.content"
        name="content"
        required
        minlength="2"
        maxlength="500"
        placeholder="updtaed comment"
        cols="30"
        rows="30"
      >
      </textarea>

      <button
        type="submit"
        class="mt-4 bg-indigo-500 text-white py-2 px-6 rounded-md hover:bg-indigo-400"
      >
        update
      </button>
    </form>
  </div>
</div>
